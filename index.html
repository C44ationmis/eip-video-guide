<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<!--
  ===== 編輯說明 =====
  1. 改顏色：找下面的 :root，--accent 是橘色強調色、--navy 是深藍主色
  2. 改標題、副標、頁尾文字：直接搜尋網頁上看到的中文字修改
  3. 改影片：往下找「影片清單」
-->
<title>EIP 使用者影音教學｜EIP・BPM・DMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ▼ 配色設定：改這裡就能換整個網站的顏色 */
  :root{
    --bg:#f6f7f8; --white:#fff; --ink:#162c40; --ink-strong:#0f2740; --navy:#17324d;
    --muted:#607080; --line:#dce2e7; --line2:#d7e2eb; --accent:#e97932; --active:#eaf0f5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;color-scheme:light}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.5}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .wrap{max-width:1094px;margin:0 auto;padding:0 20px;box-sizing:content-box}

  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  header .wrap{height:58px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:var(--ink-strong);letter-spacing:.4px}
  .logo{width:32px;height:32px;border-radius:5px;background:var(--navy);display:grid;place-items:center;box-shadow:3px -3px 0 0 #5a7186}
  .logo svg{margin-left:2px}
  .ext{font-size:12px;font-weight:700;color:var(--ink-strong)}
  .ext:hover{color:var(--accent)}

  /* hero */
  .hero{padding:40px 0 24px}
  .eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.06em;margin-bottom:10px}
  .hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
  h1{font-size:48px;font-weight:400;letter-spacing:-1.68px;color:var(--ink-strong);line-height:1.25}
  .sub{color:var(--muted);font-size:14px;margin-top:8px}
  .count{white-space:nowrap;color:var(--muted);font-size:12px;font-weight:500}
  .count strong{font-size:34px;font-weight:700;color:var(--navy);margin-right:6px;vertical-align:-3px}

  .search{margin-top:24px;display:flex;align-items:center;gap:12px;height:56px;padding:0 10px 0 16px;background:var(--white);border:1px solid #cdd6dd;border-radius:6px;box-shadow:0 4px 18px rgba(15,39,64,.04)}
  .search:focus-within{border-color:var(--navy)}
  .search svg{flex:none;color:var(--muted)}
  .search input{flex:1;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--ink)}
  .search input::placeholder{color:#8a96a3}
  .kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:5px 7px;white-space:nowrap}

  /* layout */
  .layout{display:grid;grid-template-columns:222px 1fr;gap:20px;align-items:start;margin-top:24px}
  aside{position:sticky;top:78px;background:var(--white);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .side-title{padding:16px;font-size:14px;border-bottom:1px solid var(--line)}
  .cat{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:14px;border-bottom:1px solid var(--line);border-left:3px solid transparent;text-align:left;background:var(--white)}
  .cat:hover{background:#f7f9fb}
  .cat[aria-pressed="true"]{background:var(--active);border-left-color:var(--accent);font-weight:700;color:var(--ink-strong)}
  .pill{font-size:11px;font-weight:700;color:var(--navy);border:1px solid #cbd6df;border-radius:999px;padding:3px 7px;background:rgba(255,255,255,.62);min-width:26px;text-align:center}
  .help{padding:16px}
  .help b{display:block;font-size:12px;color:var(--ink-strong);margin-bottom:6px}
  .help p{font-size:11px;color:var(--muted);line-height:1.7}

  .panel{background:var(--white);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(15,39,64,.035);overflow:hidden}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
  .panel-head h2{font-size:17px;font-weight:500;color:var(--ink-strong)}
  .panel-head small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
  .panel-head .n{font-size:11px;font-weight:500;color:var(--muted)}

  article{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}
  article:last-child{border-bottom:0}
  article:hover{background:#fafbfc}
  .thumb{height:64px;border:1px solid var(--line2);border-radius:6px;background:linear-gradient(135deg,#f3f6f9,#e4ebf1);display:grid;place-items:center}
  .play{width:30px;height:30px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
  .thumb:hover .play{transform:scale(1.08)}
  .play{transition:transform .15s}
  .tags{display:flex;gap:6px;align-items:center;margin-bottom:2px}
  .tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid}
  .t-EIP{color:#146456;background:#eaf6f3;border-color:#b9ded5}
  .t-BPM{color:#a34c18;background:#fff3eb;border-color:#f5c9ad}
  .t-DMS{color:#4e4c94;background:#f0effa;border-color:#cecaec}
  .sub-cat{font-size:10px;font-weight:600;color:var(--muted)}
  article h3{font-size:16px;font-weight:400;color:var(--ink-strong);line-height:1.45}
  article p{font-size:11px;color:var(--muted);margin-top:2px}
  .watch{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--navy);background:var(--white);border:1px solid var(--navy);border-radius:5px;padding:9px 14px;white-space:nowrap}
  .watch:hover{background:var(--navy);color:#fff}
  .empty{display:none;padding:48px 16px;text-align:center;color:var(--muted);font-size:14px}

  footer{margin-top:52px;background:var(--white);border-top:1px solid var(--line)}
  footer .wrap{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  footer p{font-size:11px;color:var(--muted)}
  footer a{font-size:11px;font-weight:700;color:var(--ink-strong)}
  footer a:hover{color:var(--accent)}

  @media (max-width:820px){
    h1{font-size:32px;letter-spacing:-.8px}
    .hero-row{flex-direction:column;align-items:flex-start}
    .layout{grid-template-columns:1fr}
    aside{position:static}
    article{grid-template-columns:84px 1fr}
    .thumb{height:52px}
    .watch{grid-column:1 / -1;justify-self:start}
    .kbd{display:none}
    footer .wrap{flex-direction:column;justify-content:center;height:auto;padding:20px}
  }
</style>
</head>
<body>
<!-- ▼ 頂部導覽列 -->

  <div class="wrap">
    <a class="brand" href="#top">
      <span class="logo"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15l12-7.5z"/></svg></span>

    </a>
