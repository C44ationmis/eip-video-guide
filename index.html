<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<!--
  ===== 編輯說明 =====
  1. 改顏色：找下面的 :root，--accent 是橘色強調色、--navy 是深藍主色
  2. 改標題、副標、頁尾文字：直接搜尋網頁上看到的中文字修改
  3. 改影片：往下找「影片清單」
-->
<title>EIP 使用者影音教學｜EIP・BPM・DMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ▼ 配色設定：改這裡就能換整個網站的顏色 */
  :root{
    --bg:#f6f7f8; --white:#fff; --ink:#162c40; --ink-strong:#0f2740; --navy:#17324d;
    --muted:#607080; --line:#dce2e7; --line2:#d7e2eb; --accent:#e97932; --active:#eaf0f5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;color-scheme:light}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.5}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .wrap{max-width:1094px;margin:0 auto;padding:0 20px;box-sizing:content-box}

  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  header .wrap{height:58px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:var(--ink-strong);letter-spacing:.4px}
  .logo{width:32px;height:32px;border-radius:5px;background:var(--navy);display:grid;place-items:center;box-shadow:3px -3px 0 0 #5a7186}
  .logo svg{margin-left:2px}
  .ext{font-size:12px;font-weight:700;color:var(--ink-strong)}
  .ext:hover{color:var(--accent)}

  /* hero */
  .hero{padding:40px 0 24px}
  .eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.06em;margin-bottom:10px}
  .hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
  h1{font-size:48px;font-weight:400;letter-spacing:-1.68px;color:var(--ink-strong);line-height:1.25}
  .sub{color:var(--muted);font-size:14px;margin-top:8px}
  .count{white-space:nowrap;color:var(--muted);font-size:12px;font-weight:500}
  .count strong{font-size:34px;font-weight:700;color:var(--navy);margin-right:6px;vertical-align:-3px}

  .search{margin-top:24px;display:flex;align-items:center;gap:12px;height:56px;padding:0 10px 0 16px;background:var(--white);border:1px solid #cdd6dd;border-radius:6px;box-shadow:0 4px 18px rgba(15,39,64,.04)}
  .search:focus-within{border-color:var(--navy)}
  .search svg{flex:none;color:var(--muted)}
  .search input{flex:1;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--ink)}
  .search input::placeholder{color:#8a96a3}
  .kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:5px 7px;white-space:nowrap}

  /* layout */
  .layout{display:grid;grid-template-columns:222px 1fr;gap:20px;align-items:start;margin-top:24px}
  aside{position:sticky;top:78px;background:var(--white);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .side-title{padding:16px;font-size:14px;border-bottom:1px solid var(--line)}
  .cat{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:14px;border-bottom:1px solid var(--line);border-left:3px solid transparent;text-align:left;background:var(--white)}
  .cat:hover{background:#f7f9fb}
  .cat[aria-pressed="true"]{background:var(--active);border-left-color:var(--accent);font-weight:700;color:var(--ink-strong)}
  .pill{font-size:11px;font-weight:700;color:var(--navy);border:1px solid #cbd6df;border-radius:999px;padding:3px 7px;background:rgba(255,255,255,.62);min-width:26px;text-align:center}
  .help{padding:16px}
  .help b{display:block;font-size:12px;color:var(--ink-strong);margin-bottom:6px}
  .help p{font-size:11px;color:var(--muted);line-height:1.7}

  .panel{background:var(--white);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(15,39,64,.035);overflow:hidden}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
  .panel-head h2{font-size:17px;font-weight:500;color:var(--ink-strong)}
  .panel-head small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
  .panel-head .n{font-size:11px;font-weight:500;color:var(--muted)}

  article{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}
  article:last-child{border-bottom:0}
  article:hover{background:#fafbfc}
  .thumb{height:64px;border:1px solid var(--line2);border-radius:6px;background:linear-gradient(135deg,#f3f6f9,#e4ebf1);display:grid;place-items:center}
  .play{width:30px;height:30px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
  .thumb:hover .play{transform:scale(1.08)}
  .play{transition:transform .15s}
  .tags{display:flex;gap:6px;align-items:center;margin-bottom:2px}
  .tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid}
  .t-EIP{color:#146456;background:#eaf6f3;border-color:#b9ded5}
  .t-BPM{color:#a34c18;background:#fff3eb;border-color:#f5c9ad}
  .t-DMS{color:#4e4c94;background:#f0effa;border-color:#cecaec}
  .sub-cat{font-size:10px;font-weight:600;color:var(--muted)}
  article h3{font-size:16px;font-weight:400;color:var(--ink-strong);line-height:1.45}
  article p{font-size:11px;color:var(--muted);margin-top:2px}
  .watch{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--navy);background:var(--white);border:1px solid var(--navy);border-radius:5px;padding:9px 14px;white-space:nowrap}
  .watch:hover{background:var(--navy);color:#fff}
  .empty{display:none;padding:48px 16px;text-align:center;color:var(--muted);font-size:14px}

  footer{margin-top:52px;background:var(--white);border-top:1px solid var(--line)}
  footer .wrap{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  footer p{font-size:11px;color:var(--muted)}
  footer a{font-size:11px;font-weight:700;color:var(--ink-strong)}
  footer a:hover{color:var(--accent)}

  @media (max-width:820px){
    h1{font-size:32px;letter-spacing:-.8px}
    .hero-row{flex-direction:column;align-items:flex-start}
    .layout{grid-template-columns:1fr}
    aside{position:static}
    article{grid-template-columns:84px 1fr}
    .thumb{height:52px}
    .watch{grid-column:1 / -1;justify-self:start}
    .kbd{display:none}
    footer .wrap{flex-direction:column;justify-content:center;height:auto;padding:20px}
  }
</style>
</head>
<body>
<!-- ▼ 頂部導覽列 -->
<header id="top">
  <div class="wrap">
    <a class="brand" href="#top">
      <span class="logo"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15l12-7.5z"/></svg></span>
      EIP 使用者影音教學
    </a>
  </div>
</header>

<main class="wrap">
  <!-- ▼ 大標題區 -->
  <section class="hero">
    <p class="eyebrow">EIP · BPM · DMS操作知識庫</p>
    <div class="hero-row">
      <div>
        <h1>開元食品 EIP 系統操作教學指引</h1>
        <p class="sub">請於下方輸入關鍵字快速查找需要的影片教程</p>
      </div>
      <div class="count"><strong id="heroCount">42</strong>部教學影片</div>
    </div>
    <label class="search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="q" type="search" placeholder="搜尋影片，例如：代理人、查詢表單、行事曆、文件改版…" aria-label="搜尋影片">
      <span class="kbd">Ctrl K</span>
    </label>
  </section>

  <div class="layout">
    <aside>
      <div class="side-title">系統分類</div>
      <button class="cat" data-sys="ALL" aria-pressed="true">全部影片 <span class="pill" data-c="ALL"></span></button>
      <button class="cat" data-sys="EIP" aria-pressed="false">首頁內容 <span class="pill" data-c="EIP"></span></button>
      <button class="cat" data-sys="BPM" aria-pressed="false">BPM 簽核流程 <span class="pill" data-c="BPM"></span></button>
      <button class="cat" data-sys="DMS" aria-pressed="false">DMS 文管系統 <span class="pill" data-c="DMS"></span></button>
      <div class="help">
        <b>找不到關鍵字？</b>
        <p>可改用角色或動作搜尋，例如「作者」、「主管」、「借用」。</p>
      </div>
    </aside>

    <section class="panel">
      <div class="panel-head">
        <div><h2 id="listTitle">全部教學影片</h2><small>依官方頁面順序排列</small></div>
        <span class="n"><span id="shown">42</span> 影片</span>
      </div>
      <div id="list"></div>
      <div class="empty" id="empty">找不到符合的影片，換個關鍵字試試看。</div>
    </section>
  </div>
</main>

<!-- ▼ 頁尾 -->
<footer>
  <div class="wrap">
    <p>影片內容由一等一科技提供，本頁僅供集中查找與導覽。</p>
    <a href="https://www.edetw.com/elearning-uofuser/" target="_blank" rel="noopener">前往官方使用者操作教學 ↗</a>
  </div>
</footer>

<script>
const V = [
  // ▼ 影片清單：一行一部影片，照這個順序顯示在網頁上
  // 格式：["系統(EIP/BPM/DMS)", "小分類", "影片標題", "YouTube 影片ID", "一句說明"],
  // YouTube 影片ID = youtu.be/ 後面那串，例如 https://youtu.be/atojgC2kS3k → atojgC2kS3k
  // 新增影片：複製一行改內容；刪除影片：整行刪掉（注意每行結尾的逗號）
  // 第一格 "EIP" / "BPM" / "DMS" 是分類代碼，不要刪也不要改
  ["EIP", "公告", "公告－新增公告", "atojgC2kS3k", "編輯公告內容，設定主題、發布對象、通知與上下架時間。"],
  ["EIP", "公告", "公告－發布審核", "ZQsP26D1gms", "了解公告模組審核，以及透過電子簽核申請單發布公告。"],
  ["EIP", "公告", "公告－瀏覽者", "41PbSFFS6iQ", "查看已發布公告，並使用推薦與收藏等功能。"],
  ["EIP", "公告", "公告－瀏覽紀錄、刪除與修改", "rycy7tEFUGA", "查閱公告瀏覽紀錄，修改或刪除已發布內容。"],
  ["EIP", "會議室系統", "場地借用", "N9eeUiA312k", "快速預約與借用會議場地。"],
  ["EIP", "會議室系統", "行事曆借用", "0hgMoKOA55g", "從行事曆新增設備、公務車等非會議場地借用。"],
  ["EIP", "會議室系統", "週期性借用", "fquRX1Mwc9U", "建立固定週期重複發生的場地或設備借用。"],
  ["EIP", "會議室系統", "保管人借用管理", "UZepDTJOlKI", "保管人處理借出、歸還或拒絕已預約的設備。"],
  ["EIP", "內容維護", "影音維護專區", "NztrbceNZr0", "上傳影音檔案並設定可觀看的人員。"],
  ["EIP", "首頁內容", "活動看板", "qJ8NgIJqUqI", "以圖片輪播方式，在首頁面板傳達活動內容。"],
  ["EIP", "行事曆", "行事曆－新增工作與備忘", "RLIi5x9sWB8", "新增工作及備忘，並在日、週、月檢視中維護。"],
  ["EIP", "行事曆", "行事曆－新增交辦", "_PJNMscNM4E", "交辦工作、回報進度，並由交辦人進行完成審核。"],
  ["EIP", "行事曆", "行事曆－新增會議", "EQm1RsqjB78", "發起會議、邀請回覆並維護會議紀錄。"],
  ["EIP", "行事曆", "查看與維護他人行事曆", "IqNPy7iIstI", "查看他人行程，或在具備權限時協助維護。"],
  ["EIP", "行事曆", "組織行事曆", "f4H7QIiAe1s", "維護公司與部門事件，以及國定假日。"],
  ["EIP", "行事曆", "個人行事曆連結", "883a3ZAqwh0", "與 Google、Office 365、Outlook、iCloud 等行事曆同步。"],
  ["BPM", "申請者", "1-1 申請者－申請表單", "Z1fy31hQnRk", "找到需要申請的表單並開始填寫。"],
  ["BPM", "申請者", "1-2 申請者－填寫表單", "DyYHbYrDMy8", "填寫與送出表單，或代理他人填寫後送簽。"],
  ["BPM", "申請者", "1-3 申請者－查詢表單", "eZRykoSkM-w", "查詢本人或代理送審的表單，並使用作廢、取回與列印。"],
  ["BPM", "簽核者", "2-1 簽核者－待簽表單", "NUyPdd72H44", "查看目前等待本人處理的簽核表單。"],
  ["BPM", "簽核者", "2-2 簽核者－簽核方式", "P6OKgV7f2lg", "使用同意、退簽、否決與加簽等簽核功能。"],
  ["BPM", "簽核者", "2-3 簽核者－查詢已簽核表單", "IV-aj2DxfKI", "查閱已處理表單及其作廢、取回與列印功能。"],
  ["BPM", "簽核者", "2-4 簽核者－批次簽核", "ApjS8ryIICI", "一次處理多筆待簽表單。"],
  ["BPM", "代理簽核", "3-1 代理簽核者", "sGm_5QRUEPs", "設定一般、表單、角色或指定代理人等代理情境。"],
  ["BPM", "管理者", "4-1 各管理者－部門主管", "oG_Fk3lhN5U", "查詢部門成員提出的相關申請表單。"],
  ["BPM", "管理者", "4-2 各管理者－歸檔查詢", "4XwQHpTzjj4", "進行表單歸檔、統計匯出與部門申請資料查詢。"],
  ["BPM", "管理者", "4-3 各管理者－表單查閱者", "397sQbrbv9o", "查閱權限範圍內的部門申請表單。"],
  ["BPM", "管理者", "4-4 各管理者－表單負責人", "azmLkLty4kE", "管理作廢、強制結案、結案復原與審核結果。"],
  ["BPM", "管理者", "4-5 各管理者－表單交接", "m_lWAt5Ji3A", "交接申請者送審表單，以及簽核者待簽與已簽表單。"],
  ["BPM", "管理者", "4-6 各管理者－表單管理者", "1yHSM4wnGYY", "管理送下一站、指定簽核、解除鎖定、作廢與刪除。"],
  ["DMS", "作者", "作者 01－文件新增", "ax9njK62EFQ", "新增發布文件，設定基本屬性、保存期限、類別與參考文件。"],
  ["DMS", "作者", "作者 02－文件改版", "vj4pXf6NoO4", "針對已發布文件進行版本更新。"],
  ["DMS", "作者", "作者 03－文件作廢", "krujfu0ENIk", "在取得目錄管理者授權後作廢文件。"],
  ["DMS", "作者", "作者 04－文件置換", "kaldtqCnsEo", "不變更版本與重新審核，直接置換僅需修正的文件。"],
  ["DMS", "審核者", "文件審核者 01－審核文件", "eApRcKslLGA", "處理簡易審核流程與電子簽核模式的文件審核。"],
  ["DMS", "讀者", "讀者 01－查詢公布文件", "LSuEcONo3AA", "查詢並開啟已正式發布的文件。"],
  ["DMS", "讀者", "讀者 02－觀看文件內容", "RdRJ6aQ-xDU", "了解查閱文件時可看到的內容與資訊。"],
  ["DMS", "讀者", "讀者 03－文件與目錄操作功能", "Ppg2UuBa_oo", "使用訂閱、複製連結、版本歷程、收藏、統計與評分。"],
  ["DMS", "讀者", "讀者 04－調閱文件", "_J7OvPEOk0U", "沒有讀者權限時提出調閱申請，核准後取得觀看權限。"],
  ["DMS", "讀者", "讀者 05－產生離線文件", "jVvAtuML0Mk", "產生離線文件並提供外部成員觀看。"],
  ["DMS", "目錄管理者", "目錄管理者 01－文件操作功能", "S9q75PJysl8", "管理作廢、銷毀、上下架、置換、讀者權限與紙本分發。"],
  ["DMS", "目錄管理者", "文件維護", "YUdEYMnhcXw", "調整目錄位置、搬移文件、作廢、銷毀並變更讀作者。"]
];
const NAME = {ALL:"全部教學影片",EIP:"首頁內容",BPM:"BPM 簽核流程",DMS:"DMS 文管系統"};
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list = document.getElementById("list"), q = document.getElementById("q");
const PLAY = '<span class="play"><svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span>';

const cnt = {ALL:V.length,EIP:0,BPM:0,DMS:0};
V.forEach(v => cnt[v[0]]++);
document.querySelectorAll("[data-c]").forEach(e => e.textContent = cnt[e.dataset.c]);
document.getElementById("heroCount").textContent = V.length;
document.getElementById("shown").textContent = V.length;

list.innerHTML = V.map(v => {
  const url = "https://youtu.be/" + v[3];
  const text = [v[0], NAME[v[0]], v[1], v[2], v[4]].join(" ").toLowerCase();
  return `<article data-sys="${v[0]}" data-text="${esc(text)}">
    <a class="thumb" href="${url}" target="_blank" rel="noopener" aria-label="播放 ${esc(v[2])}">${PLAY}</a>
    <div>
      <div class="tags"><span class="tag t-${v[0]}">${v[0]}</span><span class="sub-cat">${esc(v[1])}</span></div>
      <h3>${esc(v[2])}</h3>
      <p>${esc(v[4])}</p>
    </div>
    <a class="watch" href="${url}" target="_blank" rel="noopener">觀看影片 <span>↗</span></a>
  </article>`;
}).join("");

const rows = [...list.children];
let sys = "ALL";
function apply(){
  const t = q.value.trim().toLowerCase();
  let n = 0;
  rows.forEach(r => {
    const ok = (sys === "ALL" || r.dataset.sys === sys) && (!t || r.dataset.text.includes(t));
    r.style.display = ok ? "" : "none";
    if (ok) n++;
  });
  document.getElementById("shown").textContent = n;
  document.getElementById("empty").style.display = n ? "none" : "block";
  document.getElementById("listTitle").textContent = sys === "ALL" ? "全部教學影片" : NAME[sys];
}
document.querySelectorAll(".cat").forEach(b => b.addEventListener("click", () => {
  sys = b.dataset.sys;
  document.querySelectorAll(".cat").forEach(x => x.setAttribute("aria-pressed", x === b));
  apply();
}));
q.addEventListener("input", apply);
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); q.focus(); q.select(); }
  if (e.key === "Escape" && document.activeElement === q) { q.value = ""; apply(); }
});
</script>
</body>
</html>
